<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forza Race Engineer</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #1a1a1a;
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
            --accent-green: #00A74A;
            --accent-gold: #FED141;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.5rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .key-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .key-container input {
            width: 100%;
            padding-right: 5rem;
            box-sizing: border-box;
        }

        .toggle-btn {
            position: absolute;
            right: 0.75rem;
            background: #2a2a2a;
            color: var(--accent-gold);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
        }

        .toggle-btn:hover {
            background: #333333;
        }

        input[type="password"], input[type="text"], textarea {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .submit-btn {
            background-color: var(--accent-green);
            color: #000;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: opacity 0.2s ease;
        }

        .submit-btn:hover {
            opacity: 0.8;
        }

        /* Dashboard Output Styles */
        .dashboard {
            display: none; 
            gap: 1.5rem;
            flex-direction: column;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .diagnostic-tags {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .tag {
            background-color: #2a2a2a;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.9rem;
            border-left: 3px solid var(--accent-green);
        }

        .adjustments-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }

        li span.action {
            color: var(--accent-gold);
            font-weight: bold;
        }

        .engineer-notes {
            font-style: italic;
            color: var(--text-muted);
            line-height: 1.5;
            border-left: 3px solid var(--border-color);
            padding-left: 1rem;
        }

        .loading {
            display: none;
            color: var(--accent-gold);
            text-align: center;
            font-weight: bold;
            margin-top: 1rem;
        }

        .error-box {
            display: none;
            color: #ff5555;
            background: #2b1111;
            border: 1px solid #772222;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            font-size: 0.9rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Race Engineer AI</h1>
        
        <div class="input-group">
            <div class="key-container">
                <input type="password" id="api-key" placeholder="Paste your Gemini API Key here">
                <button type="button" id="toggle-key-visibility" class="toggle-btn">Show</button>
            </div>
            <textarea id="driver-input" placeholder="Describe what the car is doing... (e.g., 'It pushes wide when braking into corner entry')"></textarea>
            <button id="analyze-btn" class="submit-btn">Analyze Telemetry</button>
        </div>

        <div id="loading" class="loading">Analyzing vehicle dynamics...</div>
        <div id="error-message" class="error-box"></div>

        <div id="dashboard" class="dashboard">
            <div class="card">
                <h2>Diagnostics</h2>
                <div class="diagnostic-tags">
                    <div class="tag" id="phase-tag">Phase: --</div>
                    <div class="tag" id="symptom-tag">Symptom: --</div>
                </div>
            </div>

            <div class="adjustments-grid">
                <div class="card">
                    <h2>Primary Adjustments</h2>
                    <ul id="primary-list"></ul>
                </div>
                <div class="card">
                    <h2>Secondary Adjustments</h2>
                    <ul id="secondary-list"></ul>
                </div>
            </div>

            <div class="card">
                <h2>Engineer Notes</h2>
                <div class="engineer-notes" id="notes-text">--</div>
            </div>
        </div>
    </div>

    <script>
        const apiKeyInput = document.getElementById('api-key');
        const toggleBtn = document.getElementById('toggle-key-visibility');
        const errorBox = document.getElementById('error-message');
        const loadingBox = document.getElementById('loading');
        const dashboard = document.getElementById('dashboard');

        // 1. Auto-load saved API Key from localStorage
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('forza_gemini_api_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
            }
        });

        // 2. Toggle password visibility
        toggleBtn.addEventListener('click', () => {
            if (apiKeyInput.type === 'password') {
                apiKeyInput.type = 'text';
                toggleBtn.textContent = 'Hide';
            } else {
                apiKeyInput.type = 'password';
                toggleBtn.textContent = 'Show';
            }
        });

        // 3. Telemetry Analysis Event
        document.getElementById('analyze-btn').addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            const input = document.getElementById('driver-input').value.trim();
            
            errorBox.style.display = 'none';
            dashboard.style.display = 'none';

            if (!apiKey) {
                showError('Please enter your Gemini API Key.');
                return;
            }
            if (!input) {
                showError('Please describe what issue the car is having.');
                return;
            }

            // Save key in browser storage
            localStorage.setItem('forza_gemini_api_key', apiKey);

            loadingBox.style.display = 'block';

            // Corrected endpoint with the supported model alias
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`;
            
            const systemPrompt = `You are an expert Forza Motorsport Race Engineer. Your job is to listen to natural language complaints from a race car driver and translate them into precise, structured vehicle tuning adjustments.

            Drivers will often use slang or emotional language (e.g., "The car is a boat," "It snaps on me," "I'm plowing off the track," "The rear end steps out"). 

            Your task is to analyze their input and determine two things:
            1. The Corner Phase: Entry (Braking), Mid-Corner (Coasting), or Exit (Acceleration).
            2. The Handling Symptom: Understeer (pushing, won't turn, plowing) or Oversteer (loose, spinning, snapping).

            Once identified, apply the standard Forza tuning logic (the end of the car tuned stiffer loses grip first) to provide adjustments. 

            You MUST respond ONLY with a valid JSON object using the exact schema below. Do not include markdown formatting, conversational text, or explanations outside of the JSON structure.

            JSON Schema:
            {
              "diagnostics": {
                "identified_phase": "Entry | Mid-Corner | Exit",
                "identified_symptom": "Understeer | Oversteer"
              },
              "adjustments": {
                "primary": [
                  {"component": "string", "action": "Increase | Decrease | Soften | Stiffen"}
                ],
                "secondary": [
                  {"component": "string", "action": "Increase | Decrease | Soften | Stiffen"}
                ]
              },
              "engineer_notes": "A brief, one-sentence explanation of why this adjustment fixes their specific complaint."
            }`;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        systemInstruction: {
                            parts: [{ text: systemPrompt }]
                        },
                        contents: [{
                            role: "user",
                            parts: [{ text: input }]
                        }],
                        generationConfig: {
                            responseMimeType: "application/json" 
                        }
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    const detailedMessage = errorData.error?.message || `HTTP status: ${response.status} (${response.statusText})`;
                    throw new Error(detailedMessage);
                }

                const data = await response.json();
                
                let rawText = data.candidates[0].content.parts[0].text.trim();
                
                // Clean potential Markdown wrapping from API response
                if (rawText.startsWith('```json')) {
                    rawText = rawText.replace(/^```json\s*/, '').replace(/\s*```$/, '');
                } else if (rawText.startsWith('```')) {
                    rawText = rawText.replace(/^```\s*/, '').replace(/\s*```$/, '');
                }

                const parsedData = JSON.parse(rawText);

                renderDashboard(parsedData);
                loadingBox.style.display = 'none';
                dashboard.style.display = 'flex';

            } catch (error) {
                console.error("API Error:", error);
                loadingBox.style.display = 'none';
                showError(`Diagnostic Failure: ${error.message}`);
            }
        });

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }

        function renderDashboard(data) {
            document.getElementById('phase-tag').textContent = `Phase: ${data.diagnostics?.identified_phase || 'General'}`;
            document.getElementById('symptom-tag').textContent = `Symptom: ${data.diagnostics?.identified_symptom || 'Handling'}`;
            document.getElementById('notes-text').textContent = data.engineer_notes || 'No telemetry notes provided.';

            const populateList = (elementId, items) => {
                const ul = document.getElementById(elementId);
                ul.innerHTML = ''; 
                if (items && items.length > 0) {
                    items.forEach(item => {
                        const li = document.createElement('li');
                        li.innerHTML = `${item.component} <span class="action">${item.action}</span>`;
                        ul.appendChild(li);
                    });
                } else {
                    const li = document.createElement('li');
                    li.textContent = 'None required';
                    ul.appendChild(li);
                }
            };

            populateList('primary-list', data.adjustments?.primary);
            populateList('secondary-list', data.adjustments?.secondary);
        }
    </script>
</body>
</html>
