<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forza Race Engineer</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #1a1a1a;
            --surface-lighter: #2a2a2a;
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
            --accent-green: #00A74A;
            --accent-gold: #FED141;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        h1 {
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.5rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .key-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .key-container input {
            width: 100%;
            padding-right: 5rem;
            box-sizing: border-box;
        }

        .toggle-btn {
            position: absolute;
            right: 0.75rem;
            background: var(--surface-lighter);
            color: var(--accent-gold);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
        }

        .toggle-btn:hover {
            background: #333333;
        }

        .profile-group {
            display: flex;
            gap: 1rem;
        }

        select, input[type="password"], input[type="text"], textarea {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }

        select {
            flex: 1;
            cursor: pointer;
            appearance: none;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .submit-btn {
            background-color: var(--accent-green);
            color: #000;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: opacity 0.2s ease;
        }

        .submit-btn:hover {
            opacity: 0.8;
        }

        /* Dashboard Output Styles */
        .dashboard {
            display: none; 
            gap: 1.5rem;
            flex-direction: column;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .diagnostic-tags {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .tag {
            background-color: var(--surface-lighter);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.9rem;
            border-left: 3px solid var(--accent-green);
        }

        .adjustments-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            padding: 1rem;
            margin-bottom: 1rem;
            background-color: var(--surface-lighter);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .li-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }
        
        .component-title {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .action {
            color: var(--accent-gold);
            font-weight: bold;
            text-transform: uppercase;
        }

        .tuning-details {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .tuning-image {
            width: 120px;
            height: auto;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .tuning-description {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .engineer-notes {
            font-style: italic;
            color: var(--text-main);
            line-height: 1.5;
            border-left: 3px solid var(--border-color);
            padding-left: 1rem;
        }

        .loading {
            display: none;
            color: var(--accent-gold);
            text-align: center;
            font-weight: bold;
            margin-top: 1rem;
        }

        .error-box {
            display: none;
            color: #ff5555;
            background: #2b1111;
            border: 1px solid #772222;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        @media (max-width: 768px) {
            .profile-group {
                flex-direction: column;
            }
            .adjustments-grid {
                grid-template-columns: 1fr;
            }
            .tuning-details {
                flex-direction: column;
            }
            .tuning-image {
                width: 100%;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Race Engineer AI</h1>
        
        <div class="input-group">
            <div class="key-container">
                <input type="password" id="api-key" placeholder="Paste your Gemini API Key here">
                <button type="button" id="toggle-key-visibility" class="toggle-btn">Show</button>
            </div>
            
            <div class="profile-group">
                <select id="drivetrain" title="Drivetrain">
                    <option value="">Drivetrain (Optional)</option>
                    <option value="RWD">RWD</option>
                    <option value="FWD">FWD</option>
                    <option value="AWD">AWD</option>
                </select>
                <select id="engine" title="Engine Placement">
                    <option value="">Engine (Optional)</option>
                    <option value="Front-Engine">Front-Engine</option>
                    <option value="Mid-Engine">Mid-Engine</option>
                    <option value="Rear-Engine">Rear-Engine</option>
                </select>
                <select id="aero" title="Aero Package">
                    <option value="">Aero (Optional)</option>
                    <option value="Stock Aero">Stock Aero</option>
                    <option value="Adjustable Downforce">Adjustable Downforce</option>
                </select>
            </div>

            <textarea id="driver-input" placeholder="Describe what the car is doing... (e.g., 'It pushes wide when braking into corner entry')"></textarea>
            <button id="analyze-btn" class="submit-btn">Analyze Telemetry</button>
        </div>

        <div id="loading" class="loading">Analyzing vehicle dynamics...</div>
        <div id="error-message" class="error-box"></div>

        <div id="dashboard" class="dashboard">
            <div class="card">
                <h2>Diagnostics</h2>
                <div class="diagnostic-tags">
                    <div class="tag" id="phase-tag">Phase: --</div>
                    <div class="tag" id="symptom-tag">Symptom: --</div>
                </div>
            </div>

            <div class="adjustments-grid">
                <div class="card">
                    <h2>Primary Adjustments</h2>
                    <ul id="primary-list"></ul>
                </div>
                <div class="card">
                    <h2>Secondary Adjustments</h2>
                    <ul id="secondary-list"></ul>
                </div>
            </div>

            <div class="card">
                <h2>Engineer Notes</h2>
                <div class="engineer-notes" id="notes-text">--</div>
            </div>
        </div>
    </div>

    <script>
        // Tuning Database - Maps keywords to images and paraphrased descriptions
        const tuningDatabase = [
            {
                keywords: ["Tire", "Pressure", "PSI"],
                image: "Tires - Tire Pressure.png",
                description: "Tire pressure heavily dictates responsiveness and grip. Higher pressures make the car responsive but skittish, while lower pressures allow more flex and forgiveness. For peak racing performance, aim for a warm pressure around 33 PSI."
            },
            {
                keywords: ["Camber", "Alignment"],
                image: "Alignment - Camber.png",
                description: "Negative camber angles the top of the wheels inward, greatly increasing the tire's contact patch during hard cornering. While excellent for grip, excessive negative camber increases drag on the straights. A baseline of -1.5 degrees is often optimal."
            },
            {
                keywords: ["Anti-roll", "ARB", "Sway Bar"],
                image: "Anti-roll Bars - Anti-roll Bars.png",
                description: "Anti-roll bars connect the left and right suspension to manage body roll during cornering. Stiffening the rear ARB reduces understeer, while stiffening the front ARB mitigates oversteer. They do not affect straight-line acceleration."
            },
            {
                keywords: ["Springs", "Ride Height"],
                image: "Springs - Springs.png",
                description: "Springs dictate how much the car compresses under load. Stiffer springs prevent bottoming out but can cause bouncing on rough tracks. Running a stiffer rear spring bias helps induce oversteer, allowing for faster corner entry speeds."
            },
            {
                keywords: ["Bump", "Damping Bump"],
                image: "Damping - Bump Stiffness.png",
                description: "Bump stiffness controls how rapidly the suspension compresses over bumps or curbs. It should generally match your spring stiffness to prevent instability. A standard rule of thumb is setting bump stiffness to 65-75% of your rebound stiffness."
            },
            {
                keywords: ["Rebound", "Damping Rebound"],
                image: "Damping - Rebound Stiffness.png",
                description: "Rebound stiffness controls how fast the damper extends back down after compressing. Too stiff, and the car skips over bumps; too soft, and it wallows. Reducing front damping while stiffening the rear helps shift weight forward during cornering."
            },
            {
                keywords: ["Aero", "Downforce", "Wing"],
                image: "Aero - Downforce.png",
                description: "Aerodynamic downforce forces the car into the track at high speeds, drastically improving grip at the cost of top-speed drag. Adjusting rear downforce stabilizes high-speed oversteer, while front downforce sharpens turn-in response."
            }
        ];

        const apiKeyInput = document.getElementById('api-key');
        const toggleBtn = document.getElementById('toggle-key-visibility');
        const errorBox = document.getElementById('error-message');
        const loadingBox = document.getElementById('loading');
        const dashboard = document.getElementById('dashboard');

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('forza_gemini_api_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
            }
        });

        toggleBtn.addEventListener('click', () => {
            if (apiKeyInput.type === 'password') {
                apiKeyInput.type = 'text';
                toggleBtn.textContent = 'Hide';
            } else {
                apiKeyInput.type = 'password';
                toggleBtn.textContent = 'Show';
            }
        });

        document.getElementById('analyze-btn').addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            const rawInput = document.getElementById('driver-input').value.trim();
            
            const drivetrain = document.getElementById('drivetrain').value;
            const engine = document.getElementById('engine').value;
            const aero = document.getElementById('aero').value;
            
            errorBox.style.display = 'none';
            dashboard.style.display = 'none';

            if (!apiKey) {
                showError('Please enter your Gemini API Key.');
                return;
            }
            if (!rawInput) {
                showError('Please describe what issue the car is having.');
                return;
            }

            localStorage.setItem('forza_gemini_api_key', apiKey);
            loadingBox.style.display = 'block';

            let finalInput = rawInput;
            const profileSpecs = [drivetrain, engine, aero].filter(Boolean);
            
            if (profileSpecs.length > 0) {
                finalInput = `Vehicle Profile: ${profileSpecs.join(', ')}.\nDriver Complaint: ${rawInput}`;
            }

            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`;

            const systemPrompt = `You are an expert Forza Motorsport Race Engineer. Your job is to listen to natural language complaints from a race car driver and translate them into precise, structured vehicle tuning adjustments.

            Drivers will often use slang or emotional language. Your task is to analyze their input and determine two things:
            1. The Corner Phase: Entry (Braking), Mid-Corner (Coasting), or Exit (Acceleration).
            2. The Handling Symptom: Understeer or Oversteer.

            Once identified, apply the standard Forza tuning logic (the end of the car tuned stiffer loses grip first) to provide adjustments. 
            
            CRITICAL: If a "Vehicle Profile" is provided in the input, you MUST use it to prioritize your adjustments. For example, prioritize acceleration differential changes for AWD setups, or heavily factor in rear weight bias for Mid/Rear engine layouts snapping on exit. If Adjustable Aero is present, include downforce tweaks as secondary options.

            You MUST respond ONLY with a valid JSON object using the exact schema below. Do not include markdown formatting or explanations outside of the JSON structure.

            JSON Schema:
            {
              "diagnostics": {
                "identified_phase": "Entry | Mid-Corner | Exit",
                "identified_symptom": "Understeer | Oversteer"
              },
              "adjustments": {
                "primary": [
                  {"component": "string", "action": "Increase | Decrease | Soften | Stiffen"}
                ],
                "secondary": [
                  {"component": "string", "action": "Increase | Decrease | Soften | Stiffen"}
                ]
              },
              "engineer_notes": "A brief, one-sentence explanation of why this adjustment fixes their specific complaint, explicitly referencing their vehicle profile if one was provided."
            }`;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        systemInstruction: {
                            parts: [{ text: systemPrompt }]
                        },
                        contents: [{
                            role: "user",
                            parts: [{ text: finalInput }]
                        }],
                        generationConfig: {
                            responseMimeType: "application/json" 
                        }
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    const detailedMessage = errorData.error?.message || `HTTP status: ${response.status}`;
                    throw new Error(detailedMessage);
                }

                const data = await response.json();
                let rawText = data.candidates[0].content.parts[0].text.trim();
                
                if (rawText.startsWith('```json')) {
                    rawText = rawText.replace(/^```json\s*/, '').replace(/\s*```$/, '');
                } else if (rawText.startsWith('```')) {
                    rawText = rawText.replace(/^```\s*/, '').replace(/\s*```$/, '');
                }

                const parsedData = JSON.parse(rawText);

                renderDashboard(parsedData);
                loadingBox.style.display = 'none';
                dashboard.style.display = 'flex';

            } catch (error) {
                console.error("API Error:", error);
                loadingBox.style.display = 'none';
                showError(`Diagnostic Failure: ${error.message}`);
            }
        });

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }

        function renderDashboard(data) {
            document.getElementById('phase-tag').textContent = `Phase: ${data.diagnostics?.identified_phase || 'General'}`;
            document.getElementById('symptom-tag').textContent = `Symptom: ${data.diagnostics?.identified_symptom || 'Handling'}`;
            document.getElementById('notes-text').textContent = data.engineer_notes || 'No telemetry notes provided.';

            const populateList = (elementId, items) => {
                const ul = document.getElementById(elementId);
                ul.innerHTML = ''; 
                
                if (items && items.length > 0) {
                    items.forEach(item => {
                        const li = document.createElement('li');
                        
                        // Cross-reference AI output with our Tuning Database
                        let matchedData = null;
                        for (const entry of tuningDatabase) {
                            if (entry.keywords.some(kw => item.component.toLowerCase().includes(kw.toLowerCase()))) {
                                matchedData = entry;
                                break;
                            }
                        }

                        // Build the inner HTML structure
                        let innerContent = `
                            <div class="li-header">
                                <span class="component-title">${item.component}</span>
                                <span class="action">${item.action}</span>
                            </div>
                        `;

                        // Inject image and text if a match is found
                        if (matchedData) {
                            innerContent += `
                                <div class="tuning-details">
                                    <img src="${matchedData.image}" alt="${item.component} visualization" class="tuning-image" onerror="this.style.display='none'">
                                    <div class="tuning-description">${matchedData.description}</div>
                                </div>
                            `;
                        }

                        li.innerHTML = innerContent;
                        ul.appendChild(li);
                    });
                } else {
                    const li = document.createElement('li');
                    li.textContent = 'None required';
                    ul.appendChild(li);
                }
            };

            populateList('primary-list', data.adjustments?.primary);
            populateList('secondary-list', data.adjustments?.secondary);
        }
    </script>
</body>
</html>
